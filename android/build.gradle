// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Keep native intermediate paths short on Windows. Reanimated and Worklets
// otherwise exceed CMake/Ninja's object-path limit when the repository lives
// below a normal user profile directory.
subprojects { subproject ->
  subproject.plugins.withId('com.android.library') {
    if (subproject.name in ['react-native-reanimated', 'react-native-worklets']) {
      subproject.android.externalNativeBuild.cmake.buildStagingDirectory =
        rootProject.file("../.cxx/${subproject.name}")
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
